plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
}

subprojects {
    apply plugin: 'java'
    group = 'example'
    version = '0.1.0'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
    tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencyLocking { lockAllConfigurations() }
}

configure([project(':api-server'), project(':mcp-server')]) {
    apply plugin: 'org.springframework.boot'
    dependencies {
        implementation project(':security-support')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    }
}

project(':security-support') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
        implementation 'org.springframework.boot:spring-boot-starter-web'
    }
}

project(':api-server') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.flywaydb:flyway-core'
        runtimeOnly 'org.flywaydb:flyway-mysql'
        runtimeOnly 'com.mysql:mysql-connector-j'
    }
}

project(':mcp-server') {
    dependencies {
        implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
        implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    }
    tasks.named('processResources') {
        from(rootProject.file('../FE')) {
            include 'chat.html', 'chat.js', 'chat.css'
            into 'static'
        }
    }
}

tasks.register('verify', Exec) {
    description = 'Build both executable apps and verify real HTTP/MCP authentication and tool calls.'
    group = 'verification'
    dependsOn ':api-server:build', ':mcp-server:build', ':security-support:build'
    commandLine 'python3', 'scripts/verify.py'
}
