spring.application.name=access-mcp
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
demo.public-key=file:${DEMO_DIR:.dev/demo}/issuer-public.pem
demo.issuer=https://demo-issuer.invalid
demo.audience=access-mcp
demo.endpoint=/mcp
demo.entry-scope=mcp.connect
demo.chat-enabled=true
server.tomcat.connection-timeout=5s
access.base-url=http://127.0.0.1:8081
# STATELESS is Streamable HTTP without server sessions, NOT the legacy SSE transport.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=access-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.tool-callback-converter=false
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
# These SDK error loggers include raw protocol input/exception messages.
# The boundary filter emits fixed errors instead. Do not enable raw request logging.
logging.level.io.modelcontextprotocol.server.transport.WebMvcStatelessServerTransport=OFF
logging.level.io.modelcontextprotocol.server.DefaultMcpStatelessServerHandler=OFF
delegation.private-key=file:${DEMO_DIR:.dev/demo}/delegation-private.pem
delegation.public-key=file:${DEMO_DIR:.dev/demo}/delegation-public.pem
logging.level.io.modelcontextprotocol.server.McpStatelessAsyncServer=OFF
