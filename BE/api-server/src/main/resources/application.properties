spring.application.name=access-api
server.address=127.0.0.1
server.port=8081
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
demo.public-key=file:${DEMO_DIR:.dev/demo}/delegation-public.pem
demo.issuer=https://demo-delegation.invalid
demo.audience=access-api
demo.endpoint=/api/me/**
demo.entry-scope=access.read
demo.delegated=true
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:3307}/${MYSQL_DATABASE:access_demo}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=3000
spring.datasource.username=${MYSQL_USER:access_app}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=1
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
